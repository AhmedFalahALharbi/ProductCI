name: .NET CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Install test dependencies
        run: |
          dotnet add ProductApi.Tests/ProductApi.Tests.csproj package xunit --version 2.5.3
          dotnet add ProductApi.Tests/ProductApi.Tests.csproj package xunit.runner.visualstudio --version 2.5.3
          dotnet add ProductApi.Tests/ProductApi.Tests.csproj package Microsoft.NET.Test.Sdk --version 17.8.0
          dotnet add ProductApi.Tests/ProductApi.Tests.csproj package Moq --version 4.20.70

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 30
