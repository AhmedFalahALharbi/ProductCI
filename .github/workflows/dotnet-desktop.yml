name: .NET Core CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
        
    - name: Fix Task namespace in integration tests
      run: |
        if [ -f "ProductApi.Tests/ProductApiIntegrationTests.cs" ]; then
          echo "Fixing ProductApiIntegrationTests.cs..."
          sed -i '1s/^/using System.Threading.Tasks;\n/' ProductApi.Tests/ProductApiIntegrationTests.cs
          cat ProductApi.Tests/ProductApiIntegrationTests.cs | head -5
        fi
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release
      
    - name: Run tests
      run: dotnet test --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: "**/TestResults/*.trx"
        retention-days: 30
