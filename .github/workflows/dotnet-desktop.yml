name: .NET Core CI
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    
name: Checkout code
    uses: actions/checkout@v3
name: Setup .NET
uses: actions/setup-dotnet@v3
with:
  dotnet-version: 8.0.x
name: Restore dependencies
run: dotnet restore

name: Install test dependencies
run: |
  dotnet add ProductApi.Tests/ProductApi.Tests.csproj package xunit --version 2.5.3
  dotnet add ProductApi.Tests/ProductApi.Tests.csproj package xunit.runner.visualstudio --version 2.5.3
  dotnet add ProductApi.Tests/ProductApi.Tests.csproj package Microsoft.NET.Test.Sdk --version 17.8.0
  dotnet add ProductApi.Tests/ProductApi.Tests.csproj package Moq --version 4.20.70
name: Build
run: dotnet build --configuration Release || true

name: Run tests
run: dotnet test --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx" || true

name: Upload test results
uses: actions/upload-artifact@v4
if: always()
with:
  name: test-results
  path: "**/TestResults/*.trx"
  retention-days: 30
