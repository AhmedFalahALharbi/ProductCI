name: .NET Core CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
        
    - name: Clean solution
      run: |
        dotnet clean
        rm -rf **/bin
        rm -rf **/obj
        
    - name: Fix potential line ending issues in test files
      run: |
        find ProductApi.Tests -name "*.cs" -type f -exec sed -i 's/\r$//' {} \;
        
    - name: Update test project file
      run: |
        cat > ProductApi.Tests/ProductApi.Tests.csproj << 'EOF'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>enable</Nullable>
            <IsPackable>false</IsPackable>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Microsoft.NET.Test.Sdk" Version="17.8.0" />
            <PackageReference Include="Microsoft.AspNetCore.Mvc.Testing" Version="8.0.2" />
            <PackageReference Include="Moq" Version="4.20.70" />
            <PackageReference Include="xunit" Version="2.5.3" />
            <PackageReference Include="xunit.runner.visualstudio" Version="2.5.3">
              <IncludeAssets>runtime; build; native; contentfiles; analyzers; buildtransitive</IncludeAssets>
              <PrivateAssets>all</PrivateAssets>
            </PackageReference>
            <PackageReference Include="coverlet.collector" Version="6.0.0">
              <IncludeAssets>runtime; build; native; contentfiles; analyzers; buildtransitive</IncludeAssets>
              <PrivateAssets>all</PrivateAssets>
            </PackageReference>
          </ItemGroup>
          <ItemGroup>
            <ProjectReference Include="..\ProductApi\ProductApi.csproj" />
          </ItemGroup>
        </Project>
        EOF
        
    - name: Rewrite UnitTest1.cs
      run: |
        cat > ProductApi.Tests/UnitTest1.cs << 'EOF'
        using Xunit;
        using ProductApi.Services;
        using ProductApi.Models;
        using Microsoft.Extensions.Options;
        using Moq;
        using ProductApi.Configuration;

        namespace ProductApi.Tests
        {
            public class UnitTest1
            {
                [Fact]
                public void Test1()
                {
                    // Arrange
                    var appSettings = new AppSettings { DefaultCurrency = "USD" };
                    var mockOptions = new Mock<IOptions<AppSettings>>();
                    mockOptions.Setup(m => m.Value).Returns(appSettings);
                    
                    var service = new ProductService(mockOptions.Object);

                    // Act
                    var products = service.GetAll();

                    // Assert
                    Assert.NotNull(products);
                    Assert.NotEmpty(products);
                }
            }
        }
        EOF
        
    - name: Add System.Threading.Tasks to integration tests
      run: |
        if [ -f "ProductApi.Tests/ProductApiIntegrationTests.cs" ]; then
          sed -i '1s/^/using System.Threading.Tasks;\n/' ProductApi.Tests/ProductApiIntegrationTests.cs
        fi
        
    - name: Restore dependencies
      run: |
        dotnet nuget locals all --clear
        dotnet restore --force
      
    - name: Build
      run: dotnet build --configuration Release --no-restore
      
    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: "**/TestResults/*.trx"
        retention-days: 30
